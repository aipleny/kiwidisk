<title>오행 MBTI 사주</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 한 줄기 세로 흐름. 위에 입력, 아래로 명식표 → 요약 → 차트 → 다섯 갈래 풀이 → 운의 흐름 → 만족도.
   오방색(청·적·황·백·흑)을 오행 데이터 색으로 쓰고, 화면 강조색은 단청의 뇌록(청록) 하나만 쓴다. */
:root {
  --bg: #f5f6f3; --surface: #ffffff; --ink: #1b2430; --muted: #5d6673; --line: #d9ddd6; --soft: #eceee8;
  --accent: #1f6f66; --accent-ink: #ffffff; --warn: #9a5b00; --good: #2d6a3e; --bad: #9c2f2f;
  --wood: #2f7d5b; --fire: #c2412d; --earth: #b8860b; --metal: #7c8794; --water: #24364f;
  --font-display: "Nanum Myeongjo", "Noto Serif KR", "Batang", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161b; --surface: #1a2027; --ink: #e8ebe6; --muted: #9aa3ad; --line: #2c343d; --soft: #222a32;
  --accent: #5fb8ab; --accent-ink: #0d1a18; --warn: #e0a64a; --good: #7fc28f; --bad: #e57f7f;
  --wood: #5fb48a; --fire: #ec7b62; --earth: #e0b54a; --metal: #b4bec9; --water: #7d9cc8; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12161b; --surface: #1a2027; --ink: #e8ebe6; --muted: #9aa3ad; --line: #2c343d; --soft: #222a32;
  --accent: #5fb8ab; --accent-ink: #0d1a18; --warn: #e0a64a; --good: #7fc28f; --bad: #e57f7f;
  --wood: #5fb48a; --fire: #ec7b62; --earth: #e0b54a; --metal: #b4bec9; --water: #7d9cc8; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font: 15px/1.65 var(--font-body); }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px; display: grid; gap: 28px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font: 800 28px/1.25 var(--font-display); letter-spacing: -0.01em; }
h2 { font: 700 20px/1.3 var(--font-display); }
h3 { font: 600 15px/1.4 var(--font-body); }
p { margin: 0; max-width: 65ch; }
.eyebrow { font: 600 12px/1.2 var(--font-body); letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
section { display: grid; gap: 14px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
header.top { display: grid; gap: 6px; }
/* 입력 */
form { display: grid; gap: 14px; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); min-width: 0; }
input, select, textarea { font: 15px var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; min-width: 0; width: 100%; box-sizing: border-box; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); cursor: pointer; font-size: 14px; }
.seg input { width: auto; margin: 0; accent-color: var(--accent); }
.seg label:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
button { font: 600 15px var(--font-body); border-radius: 8px; padding: 10px 18px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button.ghost { background: transparent; color: var(--accent); }
.err { color: var(--bad); font-size: 14px; }
.example-tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); }
/* 명식표 */
.pillars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pillar { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; text-align: center; background: var(--surface); }
.pillar .cap { font-size: 12px; color: var(--muted); padding: 6px 4px; border-bottom: 1px solid var(--line); }
.pillar.me { border-color: var(--accent); }
.pillar.me .cap { color: var(--accent); font-weight: 600; }
.glyph { font: 800 clamp(30px, 8vw, 46px)/1.1 var(--font-display); padding: 10px 0 2px; }
.gsub { font-size: 12px; color: var(--muted); padding-bottom: 8px; }
.pillar .meta { font-size: 12px; border-top: 1px dashed var(--line); padding: 6px 4px; color: var(--muted); }
.el-0 { color: var(--wood); } .el-1 { color: var(--fire); } .el-2 { color: var(--earth); } .el-3 { color: var(--metal); } .el-4 { color: var(--water); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.chip.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
button.chip { font: inherit; font-size: 13px; color: var(--ink); }
.note { border-left: 3px solid var(--warn); padding: 8px 12px; background: color-mix(in srgb, var(--warn) 8%, transparent); border-radius: 0 8px 8px 0; font-size: 14px; display: grid; gap: 4px; }
/* 요약 */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); display: grid; gap: 4px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font: 700 19px/1.3 var(--font-display); }
.tile .s { font-size: 13px; color: var(--muted); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.pill.good { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
.pill.mid { background: var(--soft); color: var(--muted); }
.pill.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
/* 차트 */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 12px var(--font-body); }
.chart .lbl { fill: var(--ink); font-weight: 600; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.scroll-x { overflow-x: auto; }
/* 풀이 */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 7px 14px; font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.reading { display: grid; gap: 12px; }
.reading p + p { margin-top: 2px; }
.mbti-box { border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; background: color-mix(in srgb, var(--accent) 6%, transparent); }
.mbti-box .eyebrow { color: var(--accent); }
.axis { display: grid; grid-template-columns: 34px minmax(0, 1fr) 34px; align-items: center; gap: 8px; font: 600 14px var(--font-mono); }
.axis .bar { position: relative; height: 10px; border-radius: 999px; background: var(--soft); }
.axis .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.axis .dot { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; transform: translate(-50%, -50%); }
.axis .dot.saju { background: var(--earth); }
.axis .dot.self { background: var(--accent); border: 2px solid var(--surface); }
.axis-note { font-size: 14px; color: var(--muted); margin: 2px 0 10px 42px; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 12px; }
/* 만족도 */
.stars { display: inline-flex; gap: 2px; }
.stars button { background: none; border: none; padding: 2px; color: var(--line); font-size: 22px; line-height: 1; }
.stars button.on { color: var(--earth); }
.rate-row { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 10px; }
.yn { display: inline-flex; gap: 6px; }
.yn button { padding: 4px 10px; font-size: 13px; background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.yn button.on { border-color: var(--accent); color: var(--accent); }
.ok { color: var(--good); font-size: 14px; }
.owner { border-style: dashed; }
footer { font-size: 13px; color: var(--muted); }
@media (max-width: 520px) { .rate-row { grid-template-columns: 1fr; } h1 { font-size: 24px; } }
@media (prefers-reduced-motion: no-preference) { .pillar { transition: transform .2s ease; } .pillar:hover { transform: translateY(-2px); } }
</style>

<div class="wrap">
  <header class="top">
    <span class="eyebrow">만세력 · 궁통보감 · 자평진전 · MBTI</span>
    <h1>오행 MBTI 사주</h1>
    <p class="muted">생년월일시를 넣으면 검증된 만세력으로 명식을 세우고, 고전의 규칙과 MBTI를 겹쳐 풀어 드려요. 계산은 이 화면 안에서만 이뤄지고 입력값은 저장하지 않아요.</p>
  </header>

  <section class="panel" aria-labelledby="in-h">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap">
      <h2 id="in-h">태어난 때</h2><span class="example-tag" id="example-tag">예시 입력이 채워져 있어요</span>
    </div>
    <form id="f" novalidate>
      <div class="row">
        <label for="date">생년월일<input id="date" type="date" min="1901-01-01" max="2099-12-31" required></label>
        <label for="cal">달력<select id="cal"><option value="solar">양력</option><option value="lunar">음력</option><option value="leap">음력 윤달</option></select></label>
        <label for="sex">성별<select id="sex"><option value="">선택 안 함</option><option value="female">여성</option><option value="male">남성</option></select></label>
        <label for="place">출생지<select id="place"></select></label>
      </div>
      <div class="seg" role="radiogroup" aria-label="태어난 시각">
        <label><input type="radio" name="tmode" value="exact" id="tm-exact" checked>정확히 앎</label>
        <label><input type="radio" name="tmode" value="range" id="tm-range">대략(범위)</label>
        <label><input type="radio" name="tmode" value="unknown" id="tm-unknown">모름</label>
      </div>
      <div class="row">
        <label for="t1" id="t1-l">태어난 시각<input id="t1" type="time"></label>
        <label for="t2" id="t2-l" hidden>~ 까지<input id="t2" type="time"></label>
        <label for="mbti">MBTI (선택)<input id="mbti" placeholder="예: ENFP 또는 ENFP-T" autocomplete="off" maxlength="6"></label>
        <label for="zishi">자시(밤 11시~1시) 학파<select id="zishi"><option value="yaja">야자시(기본)</option><option value="jeongja">정자시</option><option value="midnight">자정 기준</option></select></label>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button type="submit" id="go">사주 풀기</button><span class="err" id="err" role="alert"></span></div>
    </form>
  </section>

  <div id="out" style="display:grid;gap:28px"><p class="muted">만세력 데이터를 불러오는 중…</p></div>

  <footer id="foot">사주는 참고용이며, 인생은 본인의 선택과 노력으로 바뀝니다. 절입 시각은 한국천문연구원·JPL DE421과 1분 이내로 대조했고, 조후·격국 규칙은 『궁통보감』·『자평진전』 원문과 대조했어요.</footer>
</div>

<script src="saju-engine.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const EL = ["목", "화", "토", "금", "수"], ELH = ["木", "火", "土", "金", "水"];
  const AREAS = ["총운", "성격", "재물", "직업", "애정", "건강"];
  const GROUP_OF = { 비견: "비겁", 겁재: "비겁", 식신: "식상", 상관: "식상", 편재: "재성", 정재: "재성", 편관: "관성", 정관: "관성", 편인: "인성", 정인: "인성" };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const elIdx = (ko) => EL.indexOf(ko);
  const pillCls = (r) => (r === "길" ? "good" : r === "흉" ? "bad" : "mid");
  const thisYear = new Date().getFullYear();
  let E = null, C = null, state = { area: "총운", last: null, ratings: {}, axisFit: {} };

  // 출생지 목록
  const places = ["서울", "인천", "경기", "수원", "강원", "춘천", "강릉", "충북", "청주", "충남", "천안", "대전", "세종", "전북", "전주", "전남", "광주", "목포", "경북", "대구", "포항", "경남", "창원", "부산", "울산", "제주", "평양"];
  $("#place").innerHTML = `<option value="">모름(서울 기준)</option>` + places.map((p) => `<option>${p}</option>`).join("");

  function setTimeMode() {
    const m = document.querySelector('input[name="tmode"]:checked').value;
    $("#t1-l").hidden = m === "unknown"; $("#t2-l").hidden = m !== "range";
    $("#t1-l").firstChild.textContent = m === "range" ? "부터" : "태어난 시각";
  }
  document.querySelectorAll('input[name="tmode"]').forEach((r) => r.addEventListener("change", setTimeMode));

  // 예시 입력 (실존 인물 아님)
  $("#date").value = "1992-03-21"; $("#cal").value = "solar"; $("#sex").value = "female"; $("#place").value = "부산";
  $("#tm-range").checked = true; $("#t1").value = "09:00"; $("#t2").value = "11:00"; $("#mbti").value = "INFJ-T"; setTimeMode();
  ["#date", "#cal", "#sex", "#place", "#t1", "#t2", "#mbti"].forEach((s) => $(s).addEventListener("input", () => { $("#example-tag").hidden = true; }));

  function readForm() {
    const cal = $("#cal").value, mode = document.querySelector('input[name="tmode"]:checked').value;
    const date = $("#date").value;
    if (!date) throw new Error("생년월일을 입력해 주세요.");
    const base = { date, calendar: cal === "solar" ? "solar" : "lunar", leap: cal === "leap", sex: $("#sex").value || null,
      place: $("#place").value || null, zishi: $("#zishi").value, seunYears: [thisYear, thisYear + 1] };
    const mbti = $("#mbti").value.trim();
    if (mbti) { E.parseType(mbti); base.mbti = mbti; }
    if (mode === "exact") { if (!$("#t1").value) throw new Error("태어난 시각을 넣거나 '모름'을 고르세요."); return { base, times: [{ time: $("#t1").value }] }; }
    if (mode === "unknown") return { base, times: [{ time: null }] };
    const a = $("#t1").value, b = $("#t2").value;
    if (!a || !b) throw new Error("시각 범위의 시작과 끝을 넣어 주세요.");
    if (a > b) throw new Error("범위의 끝이 시작보다 빨라요. 자정을 넘기면 두 번 나눠 보세요.");
    const cands = E.hourCandidates(base, a, b);
    return { base, times: cands.map((c) => ({ time: c.from, cand: c })) };
  }

  // ── 차트 ──
  function elementChart(l1) {
    const v = EL.map((k) => l1.elements.with_hidden[k]), vis = EL.map((k) => l1.elements.visible[k]);
    const max = Math.max(4, Math.ceil(Math.max(...v, ...vis)));
    const W = 520, H = 210, L = 34, B = 30, T = 14, bw = 30, gap = (W - L - 10) / 5;
    const y = (x) => T + (H - T - B) * (1 - x / max);
    let g = "";
    for (let t = 0; t <= max; t++) g += `<line class="grid" x1="${L}" x2="${W - 6}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
    v.forEach((x, i) => {
      const cx = L + gap * i + gap / 2;
      g += `<rect x="${cx - bw / 2}" y="${y(x)}" width="${bw}" height="${y(0) - y(x)}" rx="4" fill="var(--${["wood", "fire", "earth", "metal", "water"][i]})"/>`;
      g += `<circle cx="${cx + bw / 2 + 9}" cy="${y(vis[i])}" r="4" fill="var(--ink)"/>`;
      g += `<text class="lbl" x="${cx}" y="${H - 10}" text-anchor="middle">${ELH[i]} ${EL[i]}</text><text x="${cx}" y="${y(x) - 5}" text-anchor="middle">${x}</text>`;
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="오행 분포 막대그래프">${g}</svg>
      <div class="legend"><span><i style="background:var(--water)"></i>막대: 지장간까지 가중한 세기</span><span><i style="background:var(--ink)"></i>점: 겉으로 보이는 여덟 글자 수</span></div>`;
  }
  function gauge(score) {
    const W = 520, H = 40, x = 10 + (W - 20) * score / 100;
    const zones = [[0, 20, "극신약"], [20, 40, "신약"], [40, 60, "중화"], [60, 80, "신강"], [80, 100, "극신강"]];
    let g = zones.map(([a, b, n], i) => `<rect x="${10 + (W - 20) * a / 100}" y="8" width="${(W - 20) * (b - a) / 100 - 2}" height="10" rx="3" fill="var(--soft)"/><text x="${10 + (W - 20) * (a + b) / 200}" y="34" text-anchor="middle">${n}</text>`).join("");
    g += `<circle cx="${x}" cy="13" r="8" fill="var(--accent)"/>`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="신강신약 ${score}점">${g}</svg>`;
  }
  function luckChart(rows, labelOf) {
    const W = Math.max(520, rows.length * 62), H = 190, L = 30, T = 16, B = 44;
    const y = (v) => T + (H - T - B) * (1 - (v + 2) / 4);
    const step = (W - L - 20) / rows.length;
    let g = "";
    [-2, -1, 0, 1, 2].forEach((t) => { g += `<line class="grid" x1="${L}" x2="${W - 10}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t > 0 ? "+" + t : t}</text>`; });
    const pts = rows.map((r, i) => [L + step * i + step / 2, y(r.score)]);
    g += `<polyline fill="none" stroke="var(--muted)" stroke-width="1.5" points="${pts.map((p) => p.join(",")).join(" ")}"/>`;
    rows.forEach((r, i) => {
      const [cx, cy] = pts[i], col = r.rating === "길" ? "var(--good)" : r.rating === "흉" ? "var(--bad)" : "var(--muted)";
      g += `<circle cx="${cx}" cy="${cy}" r="${r.now ? 8 : 6}" fill="${col}" ${r.now ? 'stroke="var(--ink)" stroke-width="2"' : ""}/>`;
      g += `<text class="lbl" x="${cx}" y="${H - 24}" text-anchor="middle">${r.pillar}</text><text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(labelOf(r))}</text>`;
    });
    return `<div class="scroll-x"><svg class="chart" style="min-width:${W}px" viewBox="0 0 ${W} ${H}" role="img" aria-label="운의 흐름 점수">${g}</svg></div>`;
  }

  // ── 문장 조립 ──
  const luckGroup = (l1, pillar) => { const dm = elIdx(l1.day_master.element), BR = E.consts.BRANCHES, main = "癸己甲乙戊丙丁己庚辛戊壬"[BR.indexOf(pillar[1])];
    return ["비겁", "식상", "재성", "관성", "인성"][((E.consts.STEM_EL[E.consts.STEMS.indexOf(main)] - dm) % 5 + 5) % 5]; };
  function topGods(l2, n) { return Object.entries(l2.ten_god_distribution).sort((a, b) => b[1] - a[1]).slice(0, n).map((x) => x[0]); }
  function areaText(area, R) {

    } else if (area === "성격") {
      ps.push(`<p>${esc(D.summary)} <span class="muted">키워드: ${D.keywords.map(esc).join(" · ")}</span></p>`, `<p><b>강점</b> ${esc(D.strengths)} <b>주의</b> ${esc(D.cautions)}</p>`);
      topGods(l2, 2).forEach((g) => ps.push(`<p><b>${g}</b>이(가) 두드러져요. ${esc(C.tenGod[g].strong)}</p>`));
      l1.sinsal.slice(0, 3).forEach((s) => C.sinsal[s.name] && ps.push(`<p><b>${s.name}</b>(${s.at}주 ${s.char}) ${esc(C.sinsal[s.name])}</p>`));
    } else {
      ps.push(`<p>${esc(D.areas[area])}</p>`);
      if (area === "재물") {
        const zae = ["편재", "정재"].filter((g) => l2.ten_god_distribution[g]);
        zae.length ? zae.forEach((g) => ps.push(`<p><b>${g}</b> ${esc(C.tenGod[g].areas["재물"])}</p>`)) : ps.push(`<p>명식에 재성이 드러나지 않았어요. 돈은 재능(식상)과 신용(관·인)을 통해 들어오는 구조로 보면 좋아요.</p>`);

        star.filter((g) => l2.ten_god_distribution[g]).forEach((g) => ps.push(`<p><b>${g}</b> ${esc(C.tenGod[g].areas["애정"])}</p>`));
        if (l1.sinsal.some((s) => s.name === "도화살")) ps.push(`<p><b>도화살</b> ${esc(C.sinsal["도화살"])}</p>`);

          `<p><b>${hi}</b>이(가) 가장 강해요(${w[hi]}). ${esc(C.element[hi].excess)}</p>`);

        const k = `${a.saju_lean}_saju_${a.self}_self`; if (C.mbti.axisMismatch[k]) box += `<p><b>${a.axis}</b> ${esc(C.mbti.axisMismatch[k])}</p>`; });
      if (R.mbti.identity && area === "총운") box += `<p>${esc(C.mbti.identity[R.mbti.identity])}</p>`;

  function axisView(R) {
    const pos = (a) => { const v = Math.max(-3, Math.min(3, a.saju_score)); return 50 - v / 3 * 45; };
    return R.mbti.compare.map((a) => {
      const selfLeft = a.self === a.axis[0], k = a.match ? null : `${a.saju_lean}_saju_${a.self}_self`;

  function render(results, input) {
    const R = results[state.pick || 0].r, { l1, l2 } = R;
    state.last = { R, input, results };
    const p = l1.pillars, order = [["hour", "시주"], ["day", "일주 · 나"], ["month", "월주"], ["year", "연주"]];
    const pill = order.map(([k, cap]) => { const x = p[k];
      if (!x) return `<div class="pillar"><div class="cap">${cap}</div><div class="glyph muted">?</div><div class="gsub">시각 모름</div><div class="glyph muted">?</div><div class="meta">—</div></div>`;
      return `<div class="pillar ${k === "day" ? "me" : ""}"><div class="cap">${cap}</div>

    const cands = results.length > 1 ? `<div class="panel"><h3>시각 범위 안에서 나올 수 있는 경우</h3><div class="chips">${results.map((x, i) =>
      `<button type="button" class="chip ${i === (state.pick || 0) ? "on" : ""}" data-pick="${i}">${x.cand.from}~${x.cand.to} · ${x.cand.hour}시 (${x.cand.share}%)</button>`).join("")}</div>

    const alt = l1.alternatives || {};
    const altBits = [];
    if (alt.jie) altBits.push(`절입(${alt.jie.name} ${alt.jie.at_kst}) 전이면 ${alt.jie.before.join(" ")}, 후면 ${alt.jie.after.join(" ")}`);

    if (alt.zishi) altBits.push("자시 학파별: " + Object.entries(alt.zishi).map(([k, v]) => `${{ yaja: "야자시", jeongja: "정자시", midnight: "자정" }[k]} ${v.day}일 ${v.hour}시`).join(" / "));
    const notes = [...l1.warnings.filter((w) => !w.startsWith("성별")), ...altBits];
    const t = l1.time;
    const tiles = `<div class="tiles">
      <div class="tile"><span class="k">일간</span><span class="v el-${elIdx(l1.day_master.element)}">${l1.day_master.char} ${C.dayMaster[l1.day_master.char].name}</span><span class="s">${esc(C.dayMaster[l1.day_master.char].image)}</span></div>
      <div class="tile"><span class="k">강약 [적천수]</span><span class="v">${l2.strength.grade} <span class="mono" style="font-size:14px">${l2.strength.score}</span></span><span class="s">득령 ${l2.strength.deuk_ryeong ? "○" : "×"} · 득지 ${l2.strength.deuk_ji ? "○" : "×"} · 득세 ${l2.strength.deuk_se ? "○" : "×"}</span></div>
      <div class="tile"><span class="k">격국 [자평진전]</span><span class="v">${l2.gyeokguk.name}</span><span class="s"><span class="pill ${l2.gyeokguk.status.startsWith("성격") ? "good" : l2.gyeokguk.status === "파격" ? "bad" : "mid"}">${l2.gyeokguk.status}</span> ${esc(l2.gyeokguk.reason[0] || "")}</span></div>
      <div class="tile"><span class="k">용신 · 희신 · 기신</span><span class="v"><span class="el-${l2.yongsin.element_idx}">${l2.yongsin.element}</span> · <span class="el-${l2.yongsin.huisin_idx}">${l2.yongsin.huisin}</span> · <span class="el-${l2.yongsin.gisin_idx}">${l2.yongsin.gisin}</span></span><span class="s">${l2.yongsin.method} · 신뢰도 ${l2.yongsin.confidence}</span></div>
    </div>`;
    const seun = l2.seun_rating.map((s) => { const g = luckGroup(l1, s.pillar), ny = C.newYear[String(s.year)];
      return `<div class="tile"><span class="k">${s.year}년 세운</span><span class="v">${s.pillar} <span class="pill ${pillCls(s.rating)}">${s.rating}</span></span>
      <span class="s">${esc(ny ? ny.headline : C.luck[g].theme)}</span><p style="font-size:14px">${esc(C.luck[g][s.rating])}</p>
      ${s.natal.length ? `<p class="muted" style="font-size:13px">원국과: ${s.natal.map(esc).join(", ")}</p>` : ""}
      ${R.mbti ? (() => { const tm = R.mbti.timing.find((x) => x.kind === "세운" && x.when === s.year); return tm ? `<p style="font-size:13px"><b>${R.mbti.type}</b> ${tm.theme}의 해 · ${tm.function}(${tm.role})${tm.strength ? "이 힘을 쓰는 때" : "을 키울 성장 과제"}</p>` : ""; })() : ""}</div>`; }).join("");
    let daewoon = "";

      const cur = rows.find((r) => r.now);
      daewoon = `<section class="panel"><h2>10년 대운</h2>${luckChart(rows, (r) => r.age_from + "세~")}
        ${cur ? `<p><b>지금(${cur.age_from}세~) ${cur.pillar} 대운</b> <span class="pill ${pillCls(cur.rating)}">${cur.rating}</span> · ${esc(C.luck[luckGroup(l1, cur.pillar)][cur.rating])}</p>` : ""}
        <p class="muted">${l1.daewoon.direction} · 대운수 ${l1.daewoon.start_age.years}세 ${l1.daewoon.start_age.months}개월. 점수는 용신 +2, 희신 +1, 기신 −2 기준(천간 40%, 지지 60%).</p></section>`;
    } else daewoon = `<section class="panel"><h2>10년 대운</h2><p class="muted">성별을 고르면 대운 방향(순행·역행)이 정해져 10년 단위 흐름을 그려 드려요.</p></section>`;
    $("#out").innerHTML = `
      <section aria-labelledby="ms-h"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><h2 id="ms-h">명식</h2>

        <div class="pillars">${pill}</div>${cands}
        ${notes.length ? `<div class="note">${notes.map((n) => `<span>${esc(n)}</span>`).join("")}</div>` : ""}</section>
      <section aria-labelledby="sum-h"><h2 id="sum-h">한눈에</h2>${tiles}
        <div class="panel"><h3>강약 저울</h3>${gauge(l2.strength.score)}<h3>오행 분포</h3>${elementChart(l1)}
        <p class="muted" style="font-size:13px">조후 [궁통보감] ${l2.johu.basis} · 원문 「${esc(l2.johu.evidence)}」</p></div></section>
      <section aria-labelledby="rd-h"><h2 id="rd-h">풀이</h2><div class="tabs" role="tablist">${AREAS.map((a) => `<button type="button" role="tab" aria-selected="${a === state.area}" data-area="${a}">${a}</button>`).join("")}</div>
        <div class="panel reading" id="reading" role="tabpanel">${areaText(state.area, R)}</div></section>
      ${R.mbti ? `<section class="panel"><h2>타고난 결 vs 지금의 나 · ${R.mbti.type}</h2><div class="legend"><span><i style="background:var(--earth)"></i>사주 쪽 기울기</span><span><i style="background:var(--accent)"></i>내가 답한 유형</span></div>${axisView(R)}<p class="muted" style="font-size:13px">${esc(C.mbti.disclaimer)}</p></section>` : ""}
      <section aria-labelledby="yr-h"><h2 id="yr-h">${thisYear}·${thisYear + 1}년 운세</h2><div class="tiles">${seun}</div></section>

    $("#out").querySelectorAll("[data-area]").forEach((b) => b.addEventListener("click", () => { state.area = b.dataset.area; render(results, input); $("#rd-h").scrollIntoView({ block: "start" }); }));
    $("#out").querySelectorAll("[data-pick]").forEach((b) => b.addEventListener("click", () => { state.pick = Number(b.dataset.pick); render(results, input); }));
    bindSurvey(R, input);
    ownerPanel();
  }

  // ── 만족도 ──
  function surveyHtml(R) {
    return `<section class="panel" aria-labelledby="sv-h"><h2 id="sv-h">얼마나 맞았나요?</h2>
      <p class="muted">점수를 남겨 주시면 풀이 규칙을 고치는 데 써요. 생년월일은 아래 연구 동의를 체크했을 때만 함께 저장돼요.</p>
      ${AREAS.map((a) => `<div class="rate-row"><span>${a}</span><span class="stars" data-rate="${a}">${[1, 2, 3, 4, 5].map((n) => `<button type="button" aria-label="${a} ${n}점" data-n="${n}">★</button>`).join("")}</span></div>`).join("")}
      ${R.mbti ? `<h3>MBTI 축 해석이 나와 맞나요?</h3>${R.mbti.compare.map((a) => `<div class="rate-row"><span class="mono">${a.axis}</span><span class="yn" data-axis="${a.axis}"><button type="button" data-v="yes">맞아요</button><button type="button" data-v="no">아니에요</button></span></div>`).join("")}` : ""}
      <label for="sv-c">한마디 (선택)<textarea id="sv-c" rows="2" maxlength="500"></textarea></label>
      <label style="display:flex;gap:8px;align-items:flex-start;color:var(--ink)"><input type="checkbox" id="sv-consent" style="width:auto;margin-top:4px">
        <span>연구 참여에 동의해요. 생년월일·시각·출생지·성별·MBTI를 사주↔MBTI 상관 검증 통계에만 쓰고, 이름·연락처는 받지 않으며, 결과는 집계로만 공개해요.</span></label>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button type="button" id="sv-send">보내기</button><span id="sv-msg" role="status"></span></div></section>`;
  }
  function bindSurvey(R, input) {
    document.querySelectorAll("[data-rate]").forEach((g) => {
      const a = g.dataset.rate, paint = () => g.querySelectorAll("button").forEach((b) => b.classList.toggle("on", Number(b.dataset.n) <= (state.ratings[a] || 0)));
      g.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { state.ratings[a] = Number(b.dataset.n); paint(); })); paint(); });
    document.querySelectorAll("[data-axis]").forEach((g) => {
      const ax = g.dataset.axis, paint = () => g.querySelectorAll("button").forEach((b) => b.classList.toggle("on", state.axisFit[ax] === (b.dataset.v === "yes")));
      g.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { state.axisFit[ax] = b.dataset.v === "yes"; paint(); })); paint(); });
    $("#sv-send").addEventListener("click", () => sendSurvey(R, input));
  }
  let dbP = null, userP = null;
  const getDb = () => (dbP ||= (window.claude?.use ? window.claude.use("db") : Promise.resolve(null)));
  const getUser = () => (userP ||= (window.claude?.use ? window.claude.use("user") : Promise.resolve(null)));
  async function sendSurvey(R, input) {
    const msg = $("#sv-msg"), btn = $("#sv-send");
    if (!Object.keys(state.ratings).length) { msg.className = "err"; msg.textContent = "별점을 하나 이상 골라 주세요."; return; }
    btn.disabled = true; msg.className = "muted"; msg.textContent = "보내는 중…";
    try {
      const [db, user] = await Promise.all([getDb(), getUser()]);
      const uid = user ? await user.id() : null;
      if (!db || !uid) throw { code: "not_granted" };
      const { l1, l2 } = R, consent = $("#sv-consent").checked;
      const entry = { at: new Date().toISOString(), ilju: l1.pillars.day.pillar, dayMaster: l1.day_master.char, gyeok: l2.gyeokguk.name, gyeokStatus: l2.gyeokguk.status,
        strength: l2.strength.grade, yongsin: l2.yongsin.element, mbti: R.mbti ? R.mbti.type + (R.mbti.identity ? "-" + R.mbti.identity : "") : null,
        axes: R.mbti ? R.mbti.compare.map((a) => ({ axis: a.axis, lean: a.saju_lean, score: a.saju_score, self: a.self })) : [],
        ratings: { ...state.ratings }, axisFit: { ...state.axisFit }, comment: $("#sv-c").value.slice(0, 500), consent };
      if (consent) entry.birth = { date: input.date, calendar: input.calendar, leap: input.leap, time: l1.input.time, place: input.place, sex: input.sex };
      const ref = db.doc("responses/" + uid), snap = await ref.get();
      const prev = snap.exists ? (snap.data().entries || []) : [];
      await ref.set({ entries: [...prev, entry].slice(-200), updatedAt: entry.at });
      msg.className = "ok"; msg.textContent = "고마워요. 저장했어요.";
    } catch (e) {
      btn.disabled = false; msg.className = "err";
      msg.textContent = e && (e.code === "invalid_argument" || e.code === "not_granted") ? "이 화면에서는 저장 권한이 없어요. 공유한 사람에게 '참여자' 권한을 요청해 주세요." : e && e.code === "quota_exceeded" ? "저장 공간이 가득 찼어요. 관리자에게 알려 주세요." : "저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.";
    }
  }
  async function ownerPanel() {
    const user = await getUser(); if (!user || !user.isOwner()) return;
    const db = await getDb(); if (!db) return;
    try {
      const snap = await db.collection("responses").get();
      const all = snap.docs.flatMap((d) => d.data().entries || []);
      const avg = {}; AREAS.forEach((a) => { const v = all.map((e) => e.ratings[a]).filter(Boolean); avg[a] = v.length ? (v.reduce((x, y) => x + y, 0) / v.length).toFixed(2) : "—"; });
      const fit = {}; ["EI", "SN", "TF", "JP"].forEach((ax) => { const v = all.map((e) => e.axisFit && e.axisFit[ax]).filter((x) => x !== undefined); fit[ax] = v.length ? Math.round(v.filter(Boolean).length / v.length * 100) + "%" : "—"; });
      $("#owner").innerHTML = `<section class="panel owner"><span class="eyebrow">관리자에게만 보여요</span><h2>만족도 집계</h2>
        <p>응답 ${all.length}건 · 연구 동의 ${all.filter((e) => e.consent).length}건</p>
        <table><thead><tr>${AREAS.map((a) => `<th>${a}</th>`).join("")}</tr></thead><tbody><tr>${AREAS.map((a) => `<td class="mono">${avg[a]}</td>`).join("")}</tr></tbody></table>
        <table><thead><tr><th>MBTI 축</th>${Object.keys(fit).map((k) => `<th>${k}</th>`).join("")}</tr></thead><tbody><tr><td>맞다고 답한 비율</td>${Object.values(fit).map((v) => `<td class="mono">${v}</td>`).join("")}</tr></tbody></table></section>`;
    } catch (e) { /* 읽기 실패 시 패널 생략 */ }
  }

  function run(ev) {
    if (ev) ev.preventDefault();
    $("#err").textContent = "";
    try {
      const { base, times } = readForm();
      const results = times.map((t) => ({ cand: t.cand, r: E.reading({ ...base, time: t.time }) }));
      state.pick = 0; state.ratings = {}; state.axisFit = {};
      render(results, base);
    } catch (e) { $("#err").textContent = e.message || String(e); }
  }
  $("#f").addEventListener("submit", run);

  Promise.all([fetch("data/calendar.json").then((r) => r.json()), fetch("data/content-ko.json").then((r) => r.json())])
    .then(([cal, content]) => { E = SajuEngine.create(cal); C = content; run(); })
    .catch(() => { $("#out").innerHTML = `<p class="err">만세력 데이터를 불러오지 못했어요. 새로고침해 주세요.</p>`; });
})();
</script>
